<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <title>SHOP.CO</title>
  </head>
  <body>
    <div class="auth__message">
      Sign up and get 20% off to your first order.
      <span class="auth__message-link">Sign Up Now</span>
    </div>

    <header class="header">
      <div class="header__content">
        <a href="#"><img src="./images/logo/SHOP.CO.svg" alt="logo" /></a>
        <div class="header__nav">
          <ul class="header__list">
            <li class="header__item"><a href="#">Shop</a></li>
            <li class="header__item"><a href="#">On Sale</a></li>
            <li class="header__item"><a href="#">New Arrivals</a></li>
            <li class="header__item"><a href="#">Brands</a></li>
          </ul>
        </div>
        <div class="search">
          <input
            type="text"
            class="search__input"
            placeholder="Search for products..."
          />
        </div>
        <div class="header__icons">
          <a href="#"><img src="./images/icons/icon-cart.png" alt="cart" /></a>
          <a href="#"
            ><img src="./images/icons/icon-profile.png" alt="profile"
          /></a>
        </div>
      </div>
    </header>

    <main>
      <section class="main__find-clothes"></section>
      <section class="main__brands"></section>
      <section class="main__new-arrivals"></section>
      <section class="main__top-selling"></section>
      <section class="main__browse-by-dress-style"></section>
      <section class="main__our-happy-customers"></section>
    </main>

    <footer></footer>
  </body>
</html>
